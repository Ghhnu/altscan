name: Build AltScan

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # te permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Instalar y ejecutar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el .jar como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: altscan-jar
          path: build/libs/*.jar
